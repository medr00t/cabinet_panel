# Cabinet server (database + web app). Run on ONE machine: `docker compose up -d --build`
services:
  mysql:
    image: mysql:8.4
    container_name: cabinet-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"   # the web app reaches it inside Docker; nothing else on the network needs it
    env_file: .env
    environment:
      MYSQL_DATABASE: cabinet
      TZ: Africa/Casablanca
    command: --character-set-server=utf8mb4
    volumes:
      - cabinet-data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init/02-users.sh:/docker-entrypoint-initdb.d/02-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cabinet-web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${CABINET_WEB_PORT:-8080}:8080"
    env_file: .env
    volumes:
      - cabinet-config:/data      # codes and passwords (created on the first start)
      - ./backups:/backups        # Excel backups, visible in the folder server\backups

volumes:
  cabinet-data:
  cabinet-config:
