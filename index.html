<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centre Dentaire Riad El Ansari</title>
    <!-- Splash screen: plain HTML/CSS so it appears at the very first paint; src/main.tsx fades it out. -->
    <style id="splash-style">
      html, body { background: #0d2745; margin: 0; }
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden;
        background: radial-gradient(900px 520px at 50% 38%, #1d4f86 0%, transparent 62%), linear-gradient(165deg, #12335b, #091c33);
        transition: opacity .45s ease, visibility .45s; font-family: "Segoe UI", system-ui, sans-serif; }
      #splash.hide { opacity: 0; visibility: hidden; }
      #splash::before, #splash::after { content: ""; position: absolute; border-radius: 50%; border: 1px solid rgba(125, 184, 236, .12); }
      #splash::before { width: 520px; height: 520px; animation: ring 3.2s ease-in-out infinite; }
      #splash::after { width: 760px; height: 760px; animation: ring 3.2s ease-in-out .5s infinite; }
      .splash-box { position: relative; z-index: 1; display: grid; justify-items: center; text-align: center; color: #fff; }
      .splash-box img { width: 190px; height: 190px; animation: pop .8s cubic-bezier(.2, .8, .2, 1) both; filter: drop-shadow(0 10px 28px rgba(0, 0, 0, .4)); }
      .splash-box h1 { margin: 26px 0 4px; font-size: 24px; font-weight: 650; letter-spacing: -.01em; animation: rise .7s .25s both; }
      .splash-box p { margin: 0; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #8fb4dc; animation: rise .7s .4s both; }
      .splash-bar { width: 180px; height: 3px; margin-top: 34px; border-radius: 3px; background: rgba(255, 255, 255, .14); overflow: hidden; animation: rise .7s .55s both; }
      .splash-bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: #7db8ec; animation: slide 1.1s ease-in-out infinite; }
      @keyframes pop { from { opacity: 0; transform: scale(.82); } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }
      @keyframes ring { 0%, 100% { transform: scale(.96); opacity: .5; } 50% { transform: scale(1.04); opacity: 1; } }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-label="Chargement">
      <div class="splash-box">
        <img src="/logo-white.png" alt="" />
        <h1>Centre Dentaire Riad El Ansari</h1>
        <p>Système de gestion</p>
        <div class="splash-bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
