[package]
name = "cabinet_panel"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "cabinet_panel"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cabinet_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
# the Windows/Linux desktop app; the web server (Docker) is built with --no-default-features
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-fs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tracing"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
mysql = "25.0.1"
rust_xlsxwriter = "0.101.0"
calamine = "0.37.0"
base64 = "0.23.1"
sha2 = "0.11.1"
getrandom = "0.4.3"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[dev-dependencies]
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }


[[bin]]
name = "cabinet_panel"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "cabinet_web"
path = "src/bin/cabinet_web.rs"
